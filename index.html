<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berlinale Alien Walk</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; }
  #instructions {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    color: white;
    font-family: sans-serif;
    font-size: 24px;
    user-select: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="instructions">Click to start FPS controls</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';
import { PointerLockControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/PointerLockControls.js';
import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';

// --- Scene & Renderer ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0,5,10);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// --- Lights ---
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10,20,10);
scene.add(dirLight);

// --- Controls ---
const isMobile = /Mobi|Android/i.test(navigator.userAgent);
let pointerLocked = false;
let controls, orbitControls;

const move = {forward:false, backward:false, left:false, right:false, up:false, down:false};
const instructions = document.getElementById('instructions');

if(isMobile){
    if (instructions) instructions.style.display = 'none';

    orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.05;
    orbitControls.minDistance = 5;
    orbitControls.maxDistance = 100;
    orbitControls.minPolarAngle = 0;
    orbitControls.maxPolarAngle = Math.PI/2;
    orbitControls.enablePan = true;
    orbitControls.screenSpacePanning = true;
} else {
    controls = new PointerLockControls(camera, renderer.domElement);
    scene.add(controls.getObject());

    if (instructions) {
        instructions.addEventListener('click', ()=>{
            controls.lock();
            startAudio();
        });

        controls.addEventListener('lock', () => {
            instructions.style.display = 'none';
            pointerLocked = true;
        });

        controls.addEventListener('unlock', () => {
            instructions.style.display = 'block';
            pointerLocked = false;
        });
    }

    document.addEventListener('keydown', e=>{
        if(e.code==='KeyW') move.forward=true;
        if(e.code==='KeyS') move.backward=true;
        if(e.code==='KeyA') move.left=true;
        if(e.code==='KeyD') move.right=true;
        if(e.code==='Space') move.up=true;
        if(e.code==='ShiftLeft') move.down=true;
    });
    document.addEventListener('keyup', e=>{
        if(e.code==='KeyW') move.forward=false;
        if(e.code==='KeyS') move.backward=false;
        if(e.code==='KeyA') move.left=false;
        if(e.code==='KeyD') move.right=false;
        if(e.code==='Space') move.up=false;
        if(e.code==='ShiftLeft') move.down=false;
    });
}

// --- Load GLTF Alien ---
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
loader.setDRACOLoader(dracoLoader);

let mixers = [];
loader.load('./models/rigid_astronaut.glb', gltf=>{
    console.log("Model loaded:", gltf);

    const model = gltf.scene || gltf.scenes[0];
    model.scale.set(2,2,2);

    // Force simpler material on mobile (debug)
    if (isMobile) {
        model.traverse(obj => {
            if (obj.isMesh) {
                obj.material = new THREE.MeshStandardMaterial({ color: 0xffeeee });
            }
        });
    }

    scene.add(model);

    // --- bounding box & sphere ---
    const box = new THREE.Box3().setFromObject(model);
    const sphere = new THREE.Sphere();
    box.getBoundingSphere(sphere);

    // lift astronaut above waves
    model.position.y = -box.min.y + 5;

    // --- Mobile camera setup ---
    if (isMobile && orbitControls) {
        const distance = sphere.radius * 3;
        camera.position.set(
            sphere.center.x,
            sphere.center.y + sphere.radius,
            sphere.center.z + distance
        );
        orbitControls.target.copy(sphere.center);
        orbitControls.update();
    }

    // --- animations ---
    if (gltf.animations && gltf.animations.length > 0) {
        const mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
        mixers.push(mixer);
    }
});
// --- Audio & analyser ---
const listener = new THREE.AudioListener();
camera.add(listener);
const sound = new THREE.Audio(listener);
let analyser;

function startAudio(){
    const audioLoader = new THREE.AudioLoader();
    audioLoader.load('./models/fghiiiaa.wav', buffer=>{
        sound.setBuffer(buffer);
        sound.setLoop(true);
        sound.setVolume(0.6);
        sound.play();
        analyser = new THREE.AudioAnalyser(sound, 128);
    });
}

// --- Wave Plane ---
const waveSize = 200;
const waveSegments = 128;
const waveGeo = new THREE.PlaneGeometry(waveSize, waveSize, waveSegments, waveSegments);
waveGeo.rotateX(-Math.PI/2);

const waveMat = new THREE.ShaderMaterial({
    uniforms: {
        time: { value: 0 },
        audioAmp: { value: 0 }
    },
    vertexShader: `
        uniform float time;
        uniform float audioAmp;
        varying float vHeight;
        void main() {
            vec3 pos = position;
            pos.y += sin(pos.x*0.1 + time*2.0) * 1.2;
            pos.y += sin(pos.z*0.1 + time*1.5) * 1.2;
            pos.y += audioAmp * 3.0;
            pos.y -= 0.5;
            vHeight = pos.y;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
        }
    `,
    fragmentShader: `
        varying float vHeight;
        void main() {
            float gray = 0.1 + 0.2 * (vHeight*0.1 + 0.5);
            gl_FragColor = vec4(vec3(gray),0.5);
        }
    `,
    transparent: true,
    side: THREE.DoubleSide
});

const waveMesh = new THREE.Mesh(waveGeo, waveMat);
scene.add(waveMesh);

// --- Animate ---
const clock = new THREE.Clock();
function animate(){
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    mixers.forEach(m=>m.update(delta));

    // --- Desktop FPS Movement ---
    if(!isMobile && pointerLocked){
        const speed = 20 * delta;

        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();

        const right = new THREE.Vector3();
        right.crossVectors(camera.up, forward).normalize().negate();

        const obj = controls.getObject();

        if(move.forward) obj.position.addScaledVector(forward, speed);
        if(move.backward) obj.position.addScaledVector(forward, -speed);
        if(move.left) obj.position.addScaledVector(right, -speed);
        if(move.right) obj.position.addScaledVector(right, speed);
        if(move.up) obj.position.y += speed;
        if(move.down) obj.position.y -= speed;
    }

    // --- Audio reactive wave ---
    if(analyser){
        const avg = analyser.getAverageFrequency()/256;
        waveMat.uniforms.audioAmp.value = avg;
    }

    waveMat.uniforms.time.value += delta;

    if(orbitControls) orbitControls.update();
    renderer.render(scene,camera);
}
animate();

// --- Resize ---
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
