<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berlinale Alien Walk</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; }
  #instructions {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    color: white;
    font-family: sans-serif;
    font-size: 24px;
    user-select: none;
  }
</style>
</head>
<body>
<div id="instructions">Click to start FPS controls</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';
import { PointerLockControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/PointerLockControls.js';

// --- Scene & Renderer ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,2,5);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// --- Lights ---
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10,20,10);
scene.add(dirLight);

// --- Floor ---
const floorGeo = new THREE.PlaneGeometry(500,500);
const floorMat = new THREE.MeshStandardMaterial({color:0x111111});
const floor = new THREE.Mesh(floorGeo,floorMat);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// --- Controls ---
const controls = new PointerLockControls(camera, renderer.domElement);
const move = {forward:false, backward:false, left:false, right:false};
let velocity = new THREE.Vector3();
let direction = new THREE.Vector3();

document.getElementById('instructions').addEventListener('click', ()=>{
    controls.lock();
    startAudio();
    document.getElementById('instructions').style.display = 'none';
});

document.addEventListener('keydown', e=>{
    if(e.code==='KeyW') move.forward=true;
    if(e.code==='KeyS') move.backward=true;
    if(e.code==='KeyA') move.left=true;
    if(e.code==='KeyD') move.right=true;
});
document.addEventListener('keyup', e=>{
    if(e.code==='KeyW') move.forward=false;
    if(e.code==='KeyS') move.backward=false;
    if(e.code==='KeyA') move.left=false;
    if(e.code==='KeyD') move.right=false;
});

// --- Load GLTF Alien ---
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
loader.setDRACOLoader(dracoLoader);

let mixers = [];

loader.load('./models/rigid_astronaut.glb', gltf=>{
    const model = gltf.scene || gltf.scenes[0];

    // Align model bottom to y=0
    const box = new THREE.Box3().setFromObject(model);
    model.position.y = -box.min.y;
    model.scale.set(2,2,2);
    scene.add(model);

    // Animations
    if(gltf.animations && gltf.animations.length>0){
        const mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip)=>{
            mixer.clipAction(clip).play();
        });
        mixers.push(mixer);
    }
}, xhr=>console.log((xhr.loaded/xhr.total*100)+'% loaded'), err=>console.error(err));

// --- Audio & analyser ---
const listener = new THREE.AudioListener();
camera.add(listener);
const sound = new THREE.Audio(listener);
let analyser;

function startAudio(){
    const audioLoader = new THREE.AudioLoader();
    audioLoader.load('./models/fghiiiaa.wav', buffer=>{
        sound.setBuffer(buffer);
        sound.setLoop(true);
        sound.setVolume(0.6);
        sound.play();
        analyser = new THREE.AudioAnalyser(sound, 128);
    });
}

// --- Point Cloud “wave” grid ---
const gridSize = 100;
const spacing = 2;
const pointCount = gridSize*gridSize;
const positions = new Float32Array(pointCount*3);

for(let x=0;x<gridSize;x++){
    for(let z=0;z<gridSize;z++){
        const idx = x*gridSize+z;
        positions[idx*3+0] = (x-gridSize/2)*spacing;
        positions[idx*3+1] = 0;
        positions[idx*3+2] = (z-gridSize/2)*spacing;
    }
}

const waveGeo = new THREE.BufferGeometry();
waveGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));

const waveMat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.5,
    transparent:true,
    opacity:0.3
});

const wavePoints = new THREE.Points(waveGeo, waveMat);
scene.add(wavePoints);

// --- Animate ---
const clock = new THREE.Clock();
function animate(){
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    mixers.forEach(m=>m.update(delta));

    // WASD movement
    velocity.x -= velocity.x*10*delta;
    velocity.z -= velocity.z*10*delta;

    direction.z = Number(move.forward) - Number(move.backward);
    direction.x = Number(move.right) - Number(move.left);
    direction.normalize();

    if(move.forward||move.backward) velocity.z -= direction.z*50*delta;
    if(move.left||move.right) velocity.x -= direction.x*50*delta;

    const forward = new THREE.Vector3(Math.sin(camera.rotation.y),0,-Math.cos(camera.rotation.y));
    const right = new THREE.Vector3(Math.cos(camera.rotation.y),0,Math.sin(camera.rotation.y));
    camera.position.addScaledVector(forward, velocity.z*delta);
    camera.position.addScaledVector(right, velocity.x*delta);

    // --- Wave animation
    if(analyser){
        const freqData = analyser.getFrequencyData();
        const avg = analyser.getAverageFrequency()/256;
        const positions = wavePoints.geometry.attributes.position.array;
        for(let x=0;x<gridSize;x++){
            for(let z=0;z<gridSize;z++){
                const idx = x*gridSize+z;
                // simple wave: sine plus amplitude
                positions[idx*3+1] = Math.sin((x+z+clock.elapsedTime*5)/2)*2 + avg*5;
            }
        }
        wavePoints.geometry.attributes.position.needsUpdate = true;
    }

    renderer.render(scene,camera);
}
animate();

// --- Resize ---
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
