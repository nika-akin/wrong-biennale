<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berlinale Alien Walk — Quantum Scene</title>
<style>
  body { margin:0; overflow:hidden; background:black; }
  canvas { display:block; }
  #instructions {
    position:absolute;
    top:40%;
    width:100%;
    text-align:center;
    color:white;
    font-family:sans-serif;
    font-size:24px;
    user-select:none;
    cursor:pointer;
  }
  #ui{
    position:absolute;
    left:12px;
    top:12px;
    display:flex;
    gap:6px;
    align-items:center;
    z-index:10;
    font-family:sans-serif;
  }
  .btn{
    background: rgba(255,255,255,0.08);
    color:#fff;
    border:1px solid rgba(255,255,255,0.12);
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    user-select:none;
    font-size:14px;
  }
  .btn:active{ transform:translateY(1px); }
  .label{ color:#ddd; font-size:14px; margin-left:8px; }
</style>
</head>
<body>
<div id="instructions">Click to start FPS controls</div>
<div id="ui">
  <button id="sBtn" class="btn">S</button>
  <button id="pxBtn" class="btn">Px</button>
  <button id="pyBtn" class="btn">Py</button>
  <button id="pzBtn" class="btn">Pz</button>
  <button id="dBtn" class="btn">D</button>
  <button id="decBtn" class="btn">–</button>
  <button id="incBtn" class="btn">+</button>
  <div class="label" id="countLabel">particles: 10000</div>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';
import { PointerLockControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/PointerLockControls.js';
import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';

// ---------------- Scene ----------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.01, 2000);
camera.position.set(0,5,10);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
document.body.appendChild(renderer.domElement);

// ---------------- Lights ----------------
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10,20,10);
scene.add(dirLight);

// ---------------- Controls ----------------
const isMobile=/Mobi|Android/i.test(navigator.userAgent);
let pointerLocked=false;
let controls, orbitControls;
const move={forward:false,backward:false,left:false,right:false,up:false,down:false};
const instructions=document.getElementById('instructions');
if(isMobile){
    if(instructions) instructions.style.display='none';
    orbitControls=new OrbitControls(camera,renderer.domElement);
    orbitControls.enableDamping=true;
    orbitControls.dampingFactor=0.05;
    orbitControls.minDistance=5;
    orbitControls.maxDistance=100;
    orbitControls.minPolarAngle=0;
    orbitControls.maxPolarAngle=Math.PI/2;
    orbitControls.enablePan=true;
    orbitControls.screenSpacePanning=true;
}else{
    controls=new PointerLockControls(camera,renderer.domElement);
    scene.add(controls.getObject());
    if(instructions){
        instructions.addEventListener('click',()=>{
            controls.lock();
            startAudio();
        });
        controls.addEventListener('lock',()=>{ instructions.style.display='none'; pointerLocked=true; });
        controls.addEventListener('unlock',()=>{ instructions.style.display='block'; pointerLocked=false; });
    }
    document.addEventListener('keydown',e=>{
        if(e.code==='KeyW') move.forward=true;
        if(e.code==='KeyS') move.backward=true;
        if(e.code==='KeyA') move.left=true;
        if(e.code==='KeyD') move.right=true;
        if(e.code==='Space') move.up=true;
        if(e.code==='ShiftLeft') move.down=true;
    });
    document.addEventListener('keyup',e=>{
        if(e.code==='KeyW') move.forward=false;
        if(e.code==='KeyS') move.backward=false;
        if(e.code==='KeyA') move.left=false;
        if(e.code==='KeyD') move.right=false;
        if(e.code==='Space') move.up=false;
        if(e.code==='ShiftLeft') move.down=false;
    });
}

// ---------------- Load Models ----------------
const loader=new GLTFLoader();
const dracoLoader=new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
loader.setDRACOLoader(dracoLoader);
let mixers=[];
function loadGLB(path, scale = 1, pos = {x:0,y:0,z:0}, color = 0x44aaff) {
  loader.load(path, gltf => {
    const model = gltf.scene || gltf.scenes[0];
    model.scale.set(scale, scale, scale);

    // --- recenter to origin ---
    const box = new THREE.Box3().setFromObject(model);
    const center = new THREE.Vector3();
    box.getCenter(center);
    model.position.sub(center); // shifts pivot to center

    // --- lift so bottom touches y=0 ---
    const size = new THREE.Vector3();
    box.getSize(size);
    model.position.y += size.y / 2;

    // --- now apply your chosen offset ---
    model.position.add(new THREE.Vector3(pos.x, pos.y, pos.z));



    scene.add(model);
  });
}


// Example models
loadGLB('./models/rigid_astronaut.glb', 2, {x:0,y:0,z:0});
loadGLB('./models/tmp1.glb', 3, {x:20,y:0,z:0});
loadGLB('./models/tmp2.glb', 2, {x:0,y:0,z:25});
loadGLB('./models/tmp3.glb', 2, {x:0,y:0,z:10});
loadGLB('./models/tmp4.glb', 2, {x:0,y:0,z:10});
loadGLB('./models/tmp5.glb', 2, {x:0,y:0,z:10});
loadGLB('./models/tmp6.glb', 2, {x:0,y:1,z:10});

// ---------------- Audio ----------------
const listener=new THREE.AudioListener(); camera.add(listener);
const sound=new THREE.Audio(listener); let analyser;
function startAudio(){
    const audioLoader=new THREE.AudioLoader();
    audioLoader.load('./models/fghiiiaa.wav',buffer=>{
        sound.setBuffer(buffer);
        sound.setLoop(true);
        sound.setVolume(0.6);
        sound.play();
        analyser=new THREE.AudioAnalyser(sound,128);
    });
}

// ---------------- Wave Plane ----------------
const waveGeo=new THREE.PlaneGeometry(200,200,128,128); waveGeo.rotateX(-Math.PI/2);
const waveMat=new THREE.ShaderMaterial({
    uniforms:{time:{value:0},audioAmp:{value:0}},
    vertexShader:`uniform float time; uniform float audioAmp; varying float vHeight;
    void main(){ vec3 pos=position; pos.y+=sin(pos.x*0.1+time*2.0)*1.2; pos.y+=sin(pos.z*0.1+time*1.5)*1.2; pos.y+=audioAmp*3.0; pos.y-=0.5; vHeight=pos.y; gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.0);}`,
    fragmentShader:`varying float vHeight; void main(){ float gray=0.1+0.2*(vHeight*0.1+0.5); gl_FragColor=vec4(vec3(gray),0.5);}`,
    transparent:true, side:THREE.DoubleSide
});
scene.add(new THREE.Mesh(waveGeo,waveMat));

// ---------------- Electron Cloud ----------------
// (unchanged from your version)
let particleCount=10000, minParticles=2000, maxParticles=20000;
let electronGeo=null, electronCloud=null, basePositions=null;
const electronMat=new THREE.PointsMaterial({
    size:isMobile?0.06:0.05, transparent:true, opacity:0.4,
    depthWrite:false, blending:THREE.AdditiveBlending,
    map:createCircleTexture(), alphaTest:0.01
});
let currentOrbital='s';
const sBtn=document.getElementById('sBtn'), pxBtn=document.getElementById('pxBtn'),
      pyBtn=document.getElementById('pyBtn'), pzBtn=document.getElementById('pzBtn'),
      dBtn=document.getElementById('dBtn'), incBtn=document.getElementById('incBtn'),
      decBtn=document.getElementById('decBtn'), countLabel=document.getElementById('countLabel');
function updateCountLabel(){ countLabel.textContent=`particles: ${particleCount.toLocaleString()}`; }
updateCountLabel();

[sBtn,pxBtn,pyBtn,pzBtn,dBtn].forEach((btn,i)=>{ btn.addEventListener('click',()=>{ 
    const types=['s','px','py','pz','d']; currentOrbital=types[i]; regenerateOrbital(); 
});});
incBtn.addEventListener('click',()=>{ particleCount=Math.min(maxParticles,particleCount+2000); updateCountLabel(); regenerateOrbital(); });
decBtn.addEventListener('click',()=>{ particleCount=Math.max(minParticles,particleCount-2000); updateCountLabel(); regenerateOrbital(); });

function createCircleTexture(){
    const size=64;
    const canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
    const ctx=canvas.getContext('2d');
    const grad=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
    grad.addColorStop(0,'rgba(255,255,255,1)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=grad; ctx.fillRect(0,0,size,size);
    return new THREE.CanvasTexture(canvas);
}

function generatePositions(type,count){
    const arr=new Float32Array(count*3); let idx=0;
    for(let i=0;i<count;i++){
        let x=0,y=0,z=0; const r=Math.cbrt(Math.random())*6;
        if(type==='s'){ const theta=Math.acos(1-2*Math.random()); const phi=Math.random()*2*Math.PI;
            x=r*Math.sin(theta)*Math.cos(phi); y=r*Math.sin(theta)*Math.sin(phi); z=r*Math.cos(theta);
        } else if(type==='px'){ x=r*(Math.random()<0.5?-1:1); y=(Math.random()-0.5)*r*0.5; z=(Math.random()-0.5)*r*0.5;
        } else if(type==='py'){ y=r*(Math.random()<0.5?-1:1); x=(Math.random()-0.5)*r*0.5; z=(Math.random()-0.5)*r*0.5;
        } else if(type==='pz'){ z=r*(Math.random()<0.5?-1:1); x=(Math.random()-0.5)*r*0.5; y=(Math.random()-0.5)*r*0.5;
        } else if(type==='d'){ const lobe=Math.floor(Math.random()*4); const baseAngle=(Math.PI/2)*lobe;
            x=Math.cos(baseAngle)*r*0.7+(Math.random()-0.5)*0.8; y=(Math.random()-0.5)*r*0.5; z=Math.sin(baseAngle)*r*0.7+(Math.random()-0.5)*0.8;
        }
        arr[idx++]=x; arr[idx++]=y; arr[idx++]=z;
    }
    return arr;
}

function regenerateOrbital(){
    if(electronCloud){ scene.remove(electronCloud); electronGeo.dispose(); electronGeo=null; electronCloud=null; basePositions=null; }
    const positions=generatePositions(currentOrbital,particleCount);
    basePositions=positions.slice();
    electronGeo=new THREE.BufferGeometry();
    electronGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    electronGeo.setAttribute('phase', new THREE.BufferAttribute(new Float32Array(particleCount).map(()=>Math.random()*Math.PI*2),1));
    electronCloud=new THREE.Points(electronGeo,electronMat);
    electronCloud.position.set(0,6,0);
    scene.add(electronCloud);
}
regenerateOrbital();

// ---------------- Animate ----------------
const clock=new THREE.Clock();
function animate(){
    requestAnimationFrame(animate);
    const delta=clock.getDelta();
    mixers.forEach(m=>m.update(delta));

    if(!isMobile && pointerLocked){
        const speed=20*delta;
        const forward=new THREE.Vector3(); camera.getWorldDirection(forward); forward.y=0; forward.normalize();
        const right=new THREE.Vector3(); right.crossVectors(camera.up,forward).normalize().negate();
        const obj=controls.getObject();
        if(move.forward) obj.position.addScaledVector(forward,speed);
        if(move.backward) obj.position.addScaledVector(forward,-speed);
        if(move.left) obj.position.addScaledVector(right,-speed);
        if(move.right) obj.position.addScaledVector(right,speed);
        if(move.up) obj.position.y+=speed;
        if(move.down) obj.position.y-=speed;
    }

    // waves
    if(analyser) waveMat.uniforms.audioAmp.value=analyser.getAverageFrequency()/256;
    waveMat.uniforms.time.value+=delta;

    // electron cloud audio animation
    if(electronCloud && electronGeo && basePositions){
        let audioScale=1, freqShift=1;
        if(analyser){
            const avg=analyser.getAverageFrequency()/128.0; audioScale=1+avg*0.3;
            const data=analyser.getFrequencyData(); let weightedSum=0,sum=0;
            for(let i=0;i<data.length;i++){ weightedSum+=i*data[i]; sum+=data[i]; }
            if(sum>0){ freqShift=0.5+weightedSum/sum/data.length; }
        }
        electronMat.opacity=0.25+0.2*Math.sin(clock.elapsedTime*2.0*freqShift);
        const posAttr=electronGeo.getAttribute('position');
        const phaseAttr=electronGeo.getAttribute('phase');
        for(let i=0;i<posAttr.count;i++){
            const pi=i*3,ph=phaseAttr.getX(i);
            posAttr.array[pi]=basePositions[pi]*audioScale*(1+0.05*Math.sin(clock.elapsedTime+ph));
            posAttr.array[pi+1]=basePositions[pi+1]*audioScale*(1+0.05*Math.sin(clock.elapsedTime+ph));
            posAttr.array[pi+2]=basePositions[pi+2]*audioScale*(1+0.05*Math.sin(clock.elapsedTime+ph));
        }
        posAttr.needsUpdate=true;
        electronCloud.rotation.y+=0.001*freqShift;
    }

    if(orbitControls) orbitControls.update();
    renderer.render(scene,camera);
}
animate();

// ---------------- Resize ----------------
window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
