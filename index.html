<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berlinale Alien Walk - Audio Reactive</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; }
  #instructions {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    color: white;
    font-family: sans-serif;
    font-size: 24px;
  }
</style>
</head>
<body>
<div id="instructions">Click to start</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';
import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';

// --- Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.005);

// --- Camera ---
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,2,10);

// --- Renderer ---
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// --- Lights ---
scene.add(new THREE.AmbientLight(0xffffff, 2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(10,20,10);
scene.add(dirLight);

// --- Controls ---
let controls;
if (/Mobi|Android/i.test(navigator.userAgent)) {
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 5;
  controls.maxDistance = 50;
  controls.maxPolarAngle = Math.PI/2;
} else {
  let pointerLocked = false;
  let yaw=0, pitch=0;
  let move={forward:false, backward:false, left:false, right:false};
  let velocity = new THREE.Vector3();
  let direction = new THREE.Vector3();

  document.getElementById('instructions').addEventListener('click', ()=>{
    document.body.requestPointerLock();
  });
  document.addEventListener('pointerlockchange', ()=>{
    pointerLocked = document.pointerLockElement === document.body;
    document.getElementById('instructions').style.display = pointerLocked ? 'none':'block';
  });
  document.addEventListener('mousemove', e=>{
    if(!pointerLocked) return;
    yaw -= e.movementX*0.002;
    pitch -= e.movementY*0.002;
    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
    camera.rotation.set(pitch,yaw,0);
  });
  document.addEventListener('keydown', e=>{
    if(e.code==='KeyW') move.forward=true;
    if(e.code==='KeyS') move.backward=true;
    if(e.code==='KeyA') move.left=true;
    if(e.code==='KeyD') move.right=true;
  });
  document.addEventListener('keyup', e=>{
    if(e.code==='KeyW') move.forward=false;
    if(e.code==='KeyS') move.backward=false;
    if(e.code==='KeyA') move.left=false;
    if(e.code==='KeyD') move.right=false;
  });
}

// --- Floor ---
const floorGeo = new THREE.PlaneGeometry(200,200);
const floorMat = new THREE.MeshStandardMaterial({color:0x222222});
const floor = new THREE.Mesh(floorGeo,floorMat);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// --- Alien Glitch Terrain ---
const terrainGeo = new THREE.PlaneGeometry(50,50,128,128);
terrainGeo.rotateX(-Math.PI/2);

const terrainMat = new THREE.ShaderMaterial({
  uniforms:{
    time:{value:0},
    audioAmp:{value:0}
  },
  vertexShader:`
    uniform float time;
    uniform float audioAmp;
    varying float vHeight;
    void main(){
      float freq = 0.1;
      float amp = 2.0 + audioAmp*2.0;
      float h = sin(position.x*freq + time) * cos(position.z*freq + time*0.9);
      h += sin((position.x+position.z)*freq*1.5 - time*1.7);
      h *= amp;
      vHeight = h;
      vec3 displaced = position + vec3(0.0,h,0.0);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced,1.0);
    }
  `,
  fragmentShader:`
    varying float vHeight;
    void main(){
      float base = 0.2 + 0.4*fract(vHeight*0.1);
      vec3 col = mix(vec3(base,0.1,0.3), vec3(1.0,0.2,0.5), smoothstep(1.5,3.0,vHeight));
      gl_FragColor = vec4(col,1.0);
    }
  `,
  side: THREE.DoubleSide,
  transparent:false
});

const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
scene.add(terrainMesh);

// --- Audio ---
const listener = new THREE.AudioListener();
camera.add(listener);

const audio = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();
const analyser = new THREE.AudioAnalyser(audio,32);

audioLoader.load('./models/fghiiiaa.wav', buffer=>{
  audio.setBuffer(buffer);
  audio.setLoop(true);
  audio.setVolume(0.6);
  function startSound() {
    if(!audio.isPlaying) audio.play();
    document.removeEventListener('click', startSound);
    document.removeEventListener('touchstart', startSound);
  }
  document.addEventListener('click', startSound, {passive:true});
  document.addEventListener('touchstart', startSound, {passive:true});
});

// --- Load GLTF ---
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
loader.setDRACOLoader(dracoLoader);

let mixers = [];

loader.load('./models/rigid_astronaut.glb', gltf=>{
  const model = gltf.scene || gltf.scenes[0];
  model.position.set(0,1,0);
  model.scale.set(2,2,2);
  model.position.y=4;
  scene.add(model);

  if(gltf.animations && gltf.animations.length>0){
    const mixer = new THREE.AnimationMixer(model);
    gltf.animations.forEach(clip=>{
      const action = mixer.clipAction(clip);
      action.play();
    });
    mixers.push(mixer);
  }
  if(controls){
    controls.target.copy(model.position);
    controls.update();
  }
});

// --- Animate ---
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  mixers.forEach(m=>m.update(delta));

  // --- Terrain audio response ---
  const data = analyser.getAverageFrequency()/64.0; // scale
  terrainMat.uniforms.audioAmp.value = data;
  terrainMat.uniforms.time.value += delta*2.0;

  renderer.render(scene,camera);
}
animate();

// --- Resize ---
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if(controls) controls.update();
});
</script>
</body>
</html>
