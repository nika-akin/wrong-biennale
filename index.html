<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berlinale Alien Walk</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; }
  #instructions {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    color: white;
    font-family: sans-serif;
    font-size: 24px;
  }
</style>
</head>
<body>
<div id="instructions">Click to start FPS controls</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';
import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';

// --- Scene, Camera, Renderer ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,2,5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// --- Lights ---
//scene.add(new THREE.AmbientLight(0xffffff, 2));
//const dirLight = new THREE.DirectionalLight(0xffffff, 1);
//dirLight.position.set(10,20,10);
//scene.add(dirLight);


// --- Lights ---
const ambient = new THREE.AmbientLight(0x404040, 0.6);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
dirLight.position.set(10, 20, 15);
dirLight.castShadow = true;
scene.add(dirLight);

const fillLight = new THREE.PointLight(0x7722ff, 1.0, 50);
fillLight.position.set(0, 3, 0);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x88ccff, 1.0);
rimLight.position.set(-10, 5, -10);
scene.add(rimLight);


// --- Floor ---
const floorGeo = new THREE.PlaneGeometry(200,200);
const floorMat = new THREE.MeshStandardMaterial({color:0x222222});
const floor = new THREE.Mesh(floorGeo,floorMat);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ---------- Alien Glitch Terrain ---------- */
const glitchGeo = new THREE.PlaneGeometry(300, 300, 256, 256);
glitchGeo.rotateX(-Math.PI / 2);

<!-- replace your glitchMat shaderMaterial with this -->
const glitchMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0.0 } },
  vertexShader: `
    uniform float time;
    varying float vHeight;

    float wave(vec2 pos, float freq, float speed, float amp) {
      return sin(pos.x * freq + time * speed) *
             cos(pos.y * freq + time * speed) * amp;
    }

    void main() {
      float h = 0.0;
      h += wave(position.xz, 0.08, 1.0, 3.0);
      h += wave(position.xz, 0.16, 1.4, 2.0);
      h += wave(position.xz, 0.32, 0.7, 1.0);

      vHeight = h;
      vec3 displaced = position + vec3(0.0, h * 0.1, 0.0);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
    }
  `,
  fragmentShader: `
    uniform float time;
    varying float vHeight;

    void main() {
      // base color
      vec3 base = vec3(0.05, 0.05, 0.1);

      // highlight color for peaks
      vec3 peakColor = vec3(0.8, 0.2, 1.0);

      // fresnel-like factor to make ridges glow
      float fresnel = pow(1.0 - abs(normalize(vec3(vHeight,1.0,0.0)).y), 3.0);

      vec3 color = mix(base, peakColor, fresnel);

      gl_FragColor = vec4(color, 0.9);
    }
  `,
  transparent: true
});
const glitchMesh = new THREE.Mesh(glitchGeo, glitchMat);
scene.add(glitchMesh);

// --- Fog ---
scene.fog = new THREE.FogExp2(0x000000, 0.005);

function updateGlitchTerrain(delta) {
  glitchMat.uniforms.time.value += delta;
}

// --- Background protoplasm shader ---
const bgGeo = new THREE.PlaneGeometry(2, 2);
const bgMat = new THREE.ShaderMaterial({
  uniforms: {
    time: { value: 0 },
    resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
  },
  vertexShader: `void main(){ gl_Position = vec4(position,1.0); }`,
  fragmentShader: `
    uniform float time;
    uniform vec2 resolution;
    mat3 m = mat3(0.00,0.80,0.60, -0.80,0.36,-0.48, -0.60,-0.48,0.64);
    float hash(float n){ return fract(sin(n)*43758.5453); }
    float noise(in vec3 x){
      vec3 p=floor(x); vec3 f=fract(x); f=f*f*(3.-2.*f);
      float n=p.x+p.y*57.+113.*p.z;
      return mix(mix(mix(hash(n+0.),hash(n+1.),f.x),
                     mix(hash(n+57.),hash(n+58.),f.x),f.y),
                 mix(mix(hash(n+113.),hash(n+114.),f.x),
                     mix(hash(n+170.),hash(n+171.),f.x),f.y),f.z);
    }
    float fbm(vec3 p){
      float f=0.0; f+=0.5*noise(p); p=m*p*2.02;
      f+=0.25*noise(p); p=m*p*2.03;
      f+=0.125*noise(p); p=m*p*2.01;
      f+=0.0625*noise(p); return f;
    }
    void main(){
      vec2 uv=gl_FragCoord.xy/resolution.xy;
      vec3 p=vec3(uv*4.0,time*0.1);
      float f=fbm(p);
      vec3 col=vec3(f*0.1,f*0.2,f*0.1);
      gl_FragColor=vec4(col,1.0);
    }
  `,
  depthWrite: true,
  depthTest: false,
  side: THREE.DoubleSide
});
const bgScene = new THREE.Scene();
const bgCamera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
bgScene.add(new THREE.Mesh(bgGeo, bgMat));

// --- Controls ---
let controls;
let move = {forward:false, backward:false, left:false, right:false};
let velocity = new THREE.Vector3();
let direction = new THREE.Vector3();
let pitch = 0, yaw = 0;
let pointerLocked = false;

if (/Mobi|Android/i.test(navigator.userAgent)) {
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 10;
  controls.maxDistance = 200;
  controls.maxPolarAngle = Math.PI/2;
  document.getElementById('instructions').style.display = 'none';
} else {
  document.getElementById('instructions').addEventListener('click', () => {
    document.body.requestPointerLock();
    if (sound && !sound.isPlaying) {
      sound.play();
    }
  });
  document.addEventListener('pointerlockchange', () => {
    pointerLocked = document.pointerLockElement === document.body;
    document.getElementById('instructions').style.display = pointerLocked ? 'none' : 'block';
  });
  document.addEventListener('mousemove', (e) => {
    if (!pointerLocked) return;
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
    camera.rotation.set(pitch, yaw, 0);
  });
  document.addEventListener('keydown', e=>{
    if(e.code==='KeyW') move.forward=true;
    if(e.code==='KeyS') move.backward=true;
    if(e.code==='KeyA') move.left=true;
    if(e.code==='KeyD') move.right=true;
  });
  document.addEventListener('keyup', e=>{
    if(e.code==='KeyW') move.forward=false;
    if(e.code==='KeyS') move.backward=false;
    if(e.code==='KeyA') move.left=false;
    if(e.code==='KeyD') move.right=false;
  });
}

// --- GLTFLoader ---
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
loader.setDRACOLoader(dracoLoader);

let mixers = [];

loader.load('./models/rigid_astronaut.glb', gltf => {
  console.log('GLTF loaded', gltf);
  const model = gltf.scene || gltf.scenes[0];
  model.position.set(0,1,0);
  model.scale.set(2,2,2);
  model.position.y = 4;
  scene.add(model);

  // --- Animations ---
  if (gltf.animations && gltf.animations.length > 0) {
    const localMixer = new THREE.AnimationMixer(model);
    gltf.animations.forEach(clip => {
      const action = localMixer.clipAction(clip);
      action.play();
      console.log('Playing animation:', clip.name);
    });
    mixers.push(localMixer);
  } else {
    console.log('No animations in GLTF');
  }

  // --- Camera controls ---
  if (controls) {
    controls.target.copy(model.position);
    controls.update();
  } else {
    const dx = model.position.x - camera.position.x;
    const dz = model.position.z - camera.position.z;
    yaw = Math.atan2(dx, dz);
    camera.rotation.set(0, yaw, 0);
  }

  // --- Audio ---
  const listener = new THREE.AudioListener();
  camera.add(listener);
  const bgSound = new THREE.Audio(listener);
  const audioLoader = new THREE.AudioLoader();
  audioLoader.load('./models/fghiiiaa.wav', buffer => {
    bgSound.setBuffer(buffer);
    bgSound.setLoop(true);
    bgSound.setVolume(0.6);
    function startSoundOnce() {
      if (!bgSound.isPlaying) bgSound.play();
      document.removeEventListener('click', startSoundOnce);
      document.removeEventListener('touchstart', startSoundOnce);
    }
    document.addEventListener('click', startSoundOnce, {passive:true});
    document.addEventListener('touchstart', startSoundOnce, {passive:true});
  });
}, xhr=>console.log((xhr.loaded/xhr.total*100)+'% loaded'), err=>console.error(err));

// --- Animate ---
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (mixers.length > 0) {
    mixers.forEach(m => m.update(delta));
  }

  velocity.x -= velocity.x*10.0*delta;
  velocity.z -= velocity.z*10.0*delta;
  direction.z = Number(move.forward) - Number(move.backward);
  direction.x = Number(move.right) - Number(move.left);
  direction.normalize();
  if (move.forward||move.backward) velocity.z -= direction.z*50.0*delta;
  if (move.left||move.right) velocity.x -= direction.x*50.0*delta;
  const forward = new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));
  camera.position.addScaledVector(forward, velocity.z*delta);
  camera.position.addScaledVector(right, velocity.x*delta);

  if (controls) controls.update();

  updateGlitchTerrain(delta);
  glitchMat.uniforms.time.value += delta;
  bgMat.uniforms.time.value += delta;

  renderer.render(bgScene, bgCamera);
  renderer.clearDepth();
  renderer.render(scene, camera);
}
animate();

// --- Resize ---
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (controls) controls.update();
});
</script>
</body>
</html>
