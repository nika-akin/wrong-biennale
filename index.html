<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berlinale Alien Walk</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; }
  #instructions {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    color: white;
    font-family: sans-serif;
    font-size: 24px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="instructions">Click to start FPS controls</div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';
import { PointerLockControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/PointerLockControls.js';

// --- Scene, Camera, Renderer ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// --- Lights ---
const ambient = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(10,20,10);
scene.add(dirLight);

// --- Floor ---
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshStandardMaterial({color:0x222222}));
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// --- Audio setup ---
const listener = new THREE.AudioListener();
camera.add(listener);
const sound = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();
audioLoader.load('./models/fghiiiaa.wav', buffer => {
    sound.setBuffer(buffer);
    sound.setLoop(true);
    sound.setVolume(0.5);
});

// --- Tidal wave particle setup ---
const waveCount = 256;
const waveGeometry = new THREE.BufferGeometry();
const positions = new Float32Array(waveCount*waveCount*3);
for(let i=0;i<waveCount*waveCount;i++){
    positions[i*3+0] = (i % waveCount - waveCount/2);
    positions[i*3+1] = 0;
    positions[i*3+2] = (Math.floor(i/waveCount) - waveCount/2);
}
waveGeometry.setAttribute('position', new THREE.BufferAttribute(positions,3));

const waveMaterial = new THREE.PointsMaterial({
    color: 0x88ccff,
    size: 0.15,
    transparent: true,
    opacity: 0.6
});
const wavePoints = new THREE.Points(waveGeometry, waveMaterial);
scene.add(wavePoints);

// --- GLTFLoader for alien ---
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
loader.setDRACOLoader(dracoLoader);

let mixers = [];
loader.load('./models/rigid_astronaut.glb', gltf => {
    const model = gltf.scene;
    model.position.set(0,0,0);
    model.scale.set(2,2,2);
    scene.add(model);
    if(gltf.animations.length){
        const mixer = new THREE.AnimationMixer(model);
        const action = mixer.clipAction(gltf.animations[0]);
        action.play();
        mixers.push(mixer);
    }
});

// --- Controls ---
const controls = new PointerLockControls(camera, document.body);
let move = {forward:false, backward:false, left:false, right:false};
let velocity = new THREE.Vector3();
document.getElementById('instructions').addEventListener('click', ()=>{
    controls.lock();
    if(!sound.isPlaying) sound.play();
});

// --- Keyboard input ---
document.addEventListener('keydown', e=>{
    if(e.code==='KeyW') move.forward=true;
    if(e.code==='KeyS') move.backward=true;
    if(e.code==='KeyA') move.left=true;
    if(e.code==='KeyD') move.right=true;
});
document.addEventListener('keyup', e=>{
    if(e.code==='KeyW') move.forward=false;
    if(e.code==='KeyS') move.backward=false;
    if(e.code==='KeyA') move.left=false;
    if(e.code==='KeyD') move.right=false;
});

// --- Audio analyser for wave height ---
const analyser = new THREE.AudioAnalyser(sound, 256);

// --- Animate ---
const clock = new THREE.Clock();
function animate(){
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    // --- Update mixers ---
    mixers.forEach(m => m.update(delta));

    // --- Movement ---
    velocity.x -= velocity.x*10.0*delta;
    velocity.z -= velocity.z*10.0*delta;
    const direction = new THREE.Vector3(
        (move.right?1:0)-(move.left?1:0),
        0,
        (move.backward?1:0)-(move.forward?1:0)
    );
    direction.normalize();
    const forward = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
    controls.getObject().position.addScaledVector(forward, direction.z*delta*10);
    controls.getObject().position.addScaledVector(right, direction.x*delta*10);

    // --- Update wave heights based on audio ---
    const data = analyser.getFrequencyData();
    const positions = waveGeometry.attributes.position.array;
    for(let i=0;i<waveCount*waveCount;i++){
        const idx = i%data.length;
        positions[i*3+1] = data[idx]/50; // scale audio amplitude
    }
    waveGeometry.attributes.position.needsUpdate = true;

    renderer.render(scene,camera);
}
animate();

// --- Resize ---
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
