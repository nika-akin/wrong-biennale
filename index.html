<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berlinale Alien Walk</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; }
  #instructions {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    color: white;
    font-family: sans-serif;
    font-size: 24px;
  }
</style>
</head>
<body>
<div id="instructions">Click to start FPS controls</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';
import { PointerLockControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/PointerLockControls.js';

// --- Scene, Camera, Renderer ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,2,5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// --- Lights ---
const ambient = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(10,20,10);
scene.add(dirLight);

// --- Floor ---
const floorGeo = new THREE.PlaneGeometry(500,500);
const floorMat = new THREE.MeshStandardMaterial({color:0x111111});
const floor = new THREE.Mesh(floorGeo,floorMat);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// --- Audio Setup ---
const listener = new THREE.AudioListener();
camera.add(listener);
const sound = new THREE.PositionalAudio(listener);
const audioLoader = new THREE.AudioLoader();
audioLoader.load('./models/fghiiiaa.wav', buffer => {
  sound.setBuffer(buffer);
  sound.setLoop(true);
  sound.setRefDistance(5);
  sound.setVolume(0.6);
});
scene.add(sound); // attach to scene for now

const audioContext = listener.context;
const analyser = new THREE.AudioAnalyser(sound, 64);

// --- Point Cloud Terrain ---
const size = 300;
const segments = 128;
const points = [];
for(let i=0;i<=segments;i++){
  for(let j=0;j<=segments;j++){
    const x = (i/segments - 0.5) * size;
    const z = (j/segments - 0.5) * size;
    points.push(x, 0, z);
  }
}

const terrainGeo = new THREE.BufferGeometry();
terrainGeo.setAttribute('position', new THREE.Float32BufferAttribute(points,3));

const terrainMat = new THREE.PointsMaterial({
  color: 0x00ffff,
  size: 0.7,
  transparent: true,
  opacity: 0.5
});

const terrain = new THREE.Points(terrainGeo, terrainMat);
scene.add(terrain);

// --- Controls ---
const controls = new PointerLockControls(camera, renderer.domElement);
const move = {forward:false, backward:false, left:false, right:false};
let velocity = new THREE.Vector3();
let direction = new THREE.Vector3();

document.getElementById('instructions').addEventListener('click', () => {
  controls.lock();
  if (!sound.isPlaying) sound.play();
});

document.addEventListener('keydown', e=>{
  if(e.code==='KeyW') move.forward=true;
  if(e.code==='KeyS') move.backward=true;
  if(e.code==='KeyA') move.left=true;
  if(e.code==='KeyD') move.right=true;
});
document.addEventListener('keyup', e=>{
  if(e.code==='KeyW') move.forward=false;
  if(e.code==='KeyS') move.backward=false;
  if(e.code==='KeyA') move.left=false;
  if(e.code==='KeyD') move.right=false;
});

// --- GLTF Loader ---
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
loader.setDRACOLoader(dracoLoader);

let mixers = [];

loader.load('./models/rigid_astronaut.glb', gltf => {
  const model = gltf.scene || gltf.scenes[0];

  // --- Align model so bottom touches y=0 ---
  const box = new THREE.Box3().setFromObject(model);
  const height = box.max.y - box.min.y;
  model.position.y = -box.min.y; 

  model.scale.set(2,2,2);
  scene.add(model);

  if (gltf.animations && gltf.animations.length > 0) {
    const mixer = new THREE.AnimationMixer(model);
    gltf.animations.forEach((clip)=>{
      const action = mixer.clipAction(clip);
      action.play();
    });
    mixers.push(mixer);
  }

  // Attach positional audio to model
  model.add(sound);

}, xhr=>console.log((xhr.loaded/xhr.total*100)+'% loaded'), err=>console.error(err));

// --- Animate ---
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  mixers.forEach(m=>m.update(delta));

  // --- Movement ---
  velocity.x -= velocity.x*10.0*delta;
  velocity.z -= velocity.z*10.0*delta;

  direction.z = Number(move.forward) - Number(move.backward);
  direction.x = Number(move.right) - Number(move.left);
  direction.normalize();

  if(move.forward||move.backward) velocity.z -= direction.z*50.0*delta;
  if(move.left||move.right) velocity.x -= direction.x*50.0*delta;

  const forward = new THREE.Vector3(Math.sin(camera.rotation.y),0,-Math.cos(camera.rotation.y));
  const right = new THREE.Vector3(Math.cos(camera.rotation.y),0,Math.sin(camera.rotation.y));

  camera.position.addScaledVector(forward, velocity.z*delta);
  camera.position.addScaledVector(right, velocity.x*delta);

  // --- Update terrain with audio ---
  if(sound.isPlaying){
    const data = analyser.getFrequencyData();
    const positions = terrain.geometry.attributes.position.array;
    let idx=0;
    for(let i=0;i<=segments;i++){
      for(let j=0;j<=segments;j++){
        const height = data[(i+j) % data.length] / 10; 
        positions[idx+1] = height; // update y
        idx+=3;
      }
    }
    terrain.geometry.attributes.position.needsUpdate = true;
  }

  renderer.render(scene, camera);
}
animate();

// --- Resize ---
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
